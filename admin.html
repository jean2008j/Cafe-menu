<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التحكم</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#15110e">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="لوحة الكافيه">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark;--ink:#15110e;--surface:#1e1814;--raised:#2a221c;--line:#3a2f26;--bone:#f4ebdf;--muted:#a99b8a;--amber:#f0a04b;--ember:#c8631f;--on:#15110e;--bad:#f0735f;--ok:#34d399}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--bone);font:400 16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ink) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:720px;margin:0 auto;padding:14px 16px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.logo{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none}
.ttl{max-width:100%;line-height:1.35}
.ttl b{display:block;font:400 clamp(32px,10vw,48px)/1.35 "Pacifico","Aref Ruqaa","IBM Plex Sans Arabic",serif;overflow-wrap:anywhere}
.ttl small{color:var(--muted);font-size:13px}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:14px;background:var(--surface);min-height:40px;white-space:nowrap;text-decoration:none;color:var(--bone)}
.ghost:hover{border-color:var(--amber)}
.ghost.dg{color:var(--bad)}

/* page */
.pg{max-width:720px;margin:0 auto;padding:18px 16px calc(100px + env(safe-area-inset-bottom,0px))}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;background:var(--amber);color:var(--on);font-weight:600;border-radius:16px;padding:12px 20px}
.btn:active{transform:scale(.98)}
.btn.sm{width:auto;min-height:44px;padding:10px 22px;border-radius:99px}
.sum{color:var(--muted);font-size:14px;margin:14px 0 4px}
.warn{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--amber) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.warn span{flex:1}

/* filters */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 0 4px;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;min-height:40px;padding:8px 18px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-size:15px;background:transparent}
.chip[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:var(--on);font-weight:600}
.chip.edit{border-style:dashed}

/* dish rows */
.gh{margin:22px 0 8px;font-size:14px;color:var(--muted);font-weight:500}
.rows{display:flex;flex-direction:column;gap:8px}
.rw{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 12px}
.rw.off .rb{opacity:.5}
.rw{gap:4px}
.rw{flex-direction:column;align-items:stretch;gap:8px;padding:12px}
.rn{font-weight:600;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.rr{display:flex;align-items:center;gap:6px}
.rw.off .rn{opacity:.5}
.rh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rn{flex:1;min-width:0}
.rp{flex:none;color:var(--amber);font-weight:600;font-size:15px;white-space:nowrap}
.rw.off .rp{opacity:.5}
.rb{flex:1}
.ib{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--bone)}
.ib svg{width:20px;height:20px}
.ib.del{color:#ef6a5e;border-color:color-mix(in srgb,#ef6a5e 40%,var(--line))}
.ib:active{transform:scale(.94)}
.tg{min-width:50px}

.rb{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:start;min-height:60px;border-radius:12px}
.th{position:relative;width:56px;height:56px;border-radius:14px;overflow:hidden;flex:none}
.th .e{position:absolute;inset:0;display:grid;place-items:center}.th .e svg{width:86%;height:86%}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rb .n{min-width:0;line-height:1.35}
.rb .n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb .n small{color:var(--amber);font-size:14px}
.tg{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px;padding:6px 4px;font-size:12px;color:var(--muted)}
.sw{position:relative;width:46px;height:26px;border-radius:99px;background:var(--raised);border:1px solid var(--line);transition:.2s}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg[aria-checked=true] .sw{background:var(--ok);border-color:var(--ok)}
.tg[aria-checked=true] .sw::after{inset-inline-start:22px}
.tg[aria-checked=true]{color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:48px 16px}

/* forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.card h2{margin:0;font-size:17px;font-weight:600}
.fl{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.fi{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;color:var(--bone);min-height:48px}
.fi:focus{border-color:var(--amber);outline:0}
textarea.fi{resize:vertical;min-height:72px}
.hint{color:var(--muted);font-size:13px;margin:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;padding:6px 16px;border-radius:14px;border:1px solid var(--line);background:var(--raised);color:var(--bone);font-size:15px;cursor:pointer}
.seg.em label{font-size:24px;padding:4px 10px}
.seg input:checked+span,.seg label:has(input:checked){border-color:var(--amber);background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
.seg input:focus-visible+span,.seg label:has(input:focus-visible){outline:2px solid var(--amber)}
.sc{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sc button{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sc button[aria-pressed=true]{box-shadow:0 0 0 2px var(--bone)}
.sc input[type=color]{width:44px;height:44px;border:0;background:none;padding:0;border-radius:50%}
.up{display:flex;align-items:center;gap:12px}
.pv{width:72px;height:72px;border-radius:16px;background:var(--raised);border:1px dashed var(--line);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--muted);font-size:26px}
.pv img{width:100%;height:100%;object-fit:cover}
.up .bs{display:flex;flex-wrap:wrap;gap:8px}
.up input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.cb{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--bone)}
.cb input{width:22px;height:22px;accent-color:var(--amber)}
.pr{display:flex;align-items:center;gap:10px}.pr .fi{flex:1}.pr span{color:var(--muted);font-size:14px;white-space:nowrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.g2{grid-template-columns:1fr}}

/* bottom nav */
.bt{position:fixed;inset-inline:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bt .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.bt button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 9px;font-size:13px;color:var(--muted);min-height:58px}
.bt button[aria-current=page]{color:var(--amber);font-weight:600}
.bt svg{width:24px;height:24px}

/* sheet */
.mo{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sh{width:min(520px,100%);max-height:94vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:640px){.mo{align-items:center}.sh{border-radius:26px}}
.sh h2{margin:0;font-size:20px;font-weight:600}
.shh{display:flex;justify-content:space-between;align-items:center}
.x{width:44px;height:44px;border-radius:50%;font-size:24px;margin:-8px;color:var(--muted)}
.br{display:flex;gap:10px}.br .btn{flex:1}
.link{color:var(--bad);font-size:15px;min-height:44px;text-align:center}

/* qr */
.qr{align-items:center;text-align:center}
.qr h2{font:400 28px "Pacifico","Aref Ruqaa","IBM Plex Sans Arabic",serif}
.qb{background:#fff;padding:14px;border-radius:18px;display:inline-block}
.qb canvas,.qb img{display:block}

/* login */
.lg{max-width:360px;margin:0 auto;padding:22vh 20px 0;display:flex;flex-direction:column;gap:12px;text-align:center}
.lg h1{font:400 40px/1.3 "Pacifico","Aref Ruqaa","IBM Plex Sans Arabic",serif;margin:0 0 6px}
.lg p{margin:0 0 8px;color:var(--muted);font-size:15px}
.lg .fi{text-align:center;font-size:17px;letter-spacing:0}
.lg .fi:not(:placeholder-shown){font-size:24px;letter-spacing:.4em;padding-inline-start:calc(14px + .4em)}

/* toast */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-180%);z-index:90;background:var(--surface);border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);border-radius:99px;padding:11px 20px;font-size:15px;font-weight:500;transition:transform .3s cubic-bezier(.2,.8,.2,1);pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body>*{visibility:hidden}#qrp,#qrp *{visibility:visible}#qrp{position:fixed;inset:0;background:#fff;color:#000;justify-content:center;border:0}}
/* ===== تصغير الواجهة على الموبايل ===== */
@media(max-width:520px){
body{font-size:14px}
.top .in{padding:8px 12px 8px;gap:0}
.ttl b{font-size:clamp(24px,7.5vw,32px)}
.ttl small{font-size:12px}
.pg{padding:12px 12px calc(76px + env(safe-area-inset-bottom,0px))}
.btn{min-height:42px;padding:8px 16px;border-radius:13px;font-size:15px}
.sum{font-size:12.5px;margin:10px 0 2px;line-height:1.5}
.warn{font-size:12.5px;padding:9px 11px;border-radius:13px}
.ghost{font-size:13px;min-height:34px;padding:5px 12px}
.chips{padding-top:8px;margin:0 -12px;padding-inline:12px;gap:6px}
.chip{min-height:34px;padding:5px 14px;font-size:13px}
.gh{margin:14px 0 6px;font-size:13px}
.rows{gap:6px}
.rw{padding:9px 10px;border-radius:14px;gap:6px}
.rn{font-size:15px;line-height:1.35}
.rp{font-size:14px}
.th{width:44px;height:44px;border-radius:11px}
.ib{width:34px;height:34px;border-radius:10px}
.ib svg{width:17px;height:17px}
.tg{min-width:44px;padding:2px;font-size:11px;gap:1px}
.sw{width:38px;height:22px}
.sw::after{width:16px;height:16px}
.tg[aria-checked=true] .sw::after{inset-inline-start:18px}
.bt button{min-height:50px;font-size:11.5px;padding:7px 4px 6px}
.bt svg{width:21px;height:21px}
.card{padding:14px;border-radius:18px;gap:11px}
.card h2{font-size:15px}
.fl{font-size:12.5px}
.fi{min-height:42px;padding:9px 12px;font-size:15px;border-radius:12px}
.sh{padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));gap:12px}
.sh h2{font-size:17px}
.x{width:38px;height:38px;font-size:22px}
.seg label{min-height:38px;font-size:14px;padding:4px 12px}
.pv{width:60px;height:60px}
.cb{font-size:14px}
.link{font-size:14px;min-height:38px}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="config.js"></script>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ---------- البيانات (نفس مفاتيح menu.html حتى يبقى الاثنان متوافقين) ---------- */
const SEEDC=["الكل","مشروبات ساخنة","مشروبات باردة","حلويات","مأكولات خفيفة"];
const DEF_ST={name:"Corner Café",kicker:"",tag:"",tables:"",logo:"",color:"",cur:"SYP",svc:0,url:"",ca:{}};
let CATS=SEEDC.slice(),MENU=[],ST=Object.assign({},DEF_ST);
const CFG=window.CAFE_CONFIG||{};
const sb=(window.supabase&&CFG.SUPABASE_URL&&!/YOUR-/.test(CFG.SUPABASE_URL))?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
const fail=e=>toast("تعذّر الحفظ: "+((e&&e.message)||e),1);
async function pull(){
 const[c,m,s]=await Promise.all([sb.from("categories").select("*").order("id"),sb.from("menu_items").select("*").order("sort").order("created_at"),sb.from("settings").select("data").eq("id",1).maybeSingle()]);
 const err=c.error||m.error||s.error;if(err){fail(err);return false}
 CATS=["الكل"];c.data.forEach(x=>{CATS[x.id]=x.name});MENU=m.data;ST=Object.assign({},DEF_ST,s.data&&s.data.data);return true}
async function saveST(){const{error}=await sb.from("settings").upsert({id:1,data:ST});if(error)fail(error)}

const PH={};
function art(d){const h=d.h||30,e=d.e||"",k=s=>[...s].some(c=>e.includes(c));
 const kind=k("☕🥛")?"cup":k("🍵")?"tea":k("🧊🍋🍓🍹🥤🍊🍉")?"ice":k("🍨🍦")?"cream":k("🍫🍪🍰🧁🍩🍮")?"cake":k("🥐🍞🥖")?"cro":k("🥪🍔🌯")?"sand":(["cup","cup","ice","cake","cro"][d.c]||"cup");
 const L=`hsl(${h} 70% 56%)`,D=`hsl(${h} 55% 24%)`,M=`hsl(${h} 55% 42%)`;
 const S={
 cup:`<ellipse cx="100" cy="152" rx="64" ry="13" fill="#f4ebdf" opacity=".9"/><path d="M52 84H148V114A48 36 0 0 1 52 114Z" fill="#fff8ef"/><ellipse cx="100" cy="84" rx="48" ry="10" fill="#e8dccb"/><ellipse cx="100" cy="85" rx="42" ry="7" fill="${D}"/><path d="M148 94h8a14 14 0 0 1 0 26h-10" fill="none" stroke="#fff8ef" stroke-width="7" stroke-linecap="round"/><path d="M84 66c-9-10 9-14 0-26M104 66c-9-10 9-14 0-26M124 66c-9-10 9-14 0-26" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>`,
 tea:`<ellipse cx="100" cy="154" rx="44" ry="9" fill="#f4ebdf" opacity=".9"/><path d="M70 72h60l-7 82H77z" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".8" stroke-width="3" stroke-linejoin="round"/><path d="M72.5 92h55l-4.5 60H77z" fill="hsl(26 75% 40%)" fill-opacity=".92"/><path d="M96 74c-10-22 6-36 24-32-4 20-12 30-24 32zM104 78c8-18 24-24 36-14-8 16-22 20-36 14z" fill="#5fc99a"/>`,
 ice:`<path d="M62 54h76l-9 100a9 9 0 0 1-9 8H80a9 9 0 0 1-9-8z" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".8" stroke-width="3" stroke-linejoin="round"/><path d="M66.5 84h67l-5 70a6 6 0 0 1-6 5H78a6 6 0 0 1-6-5z" fill="${L}" fill-opacity=".92"/><rect x="78" y="70" width="24" height="24" rx="5" fill="#fff" fill-opacity=".6" transform="rotate(-14 90 82)"/><rect x="102" y="86" width="22" height="22" rx="5" fill="#fff" fill-opacity=".5" transform="rotate(12 113 97)"/><path d="M116 22l-10 80" stroke="#fff" stroke-width="6" stroke-linecap="round"/>`,
 cream:`<ellipse cx="100" cy="156" rx="46" ry="9" fill="#f4ebdf" opacity=".9"/><path d="M68 112h64l-10 44H78z" fill="#fff8ef"/><circle cx="86" cy="104" r="24" fill="${L}"/><circle cx="116" cy="106" r="22" fill="hsl(${h+40} 55% 66%)"/><circle cx="100" cy="82" r="22" fill="hsl(${h+80} 50% 72%)"/><circle cx="100" cy="58" r="7" fill="#e0453a"/>`,
 cake:`<ellipse cx="100" cy="158" rx="68" ry="12" fill="#fff" opacity=".85"/><path d="M58 104l44-22 46 22-46 24z" fill="${M}"/><path d="M58 104l44 24v30L58 134z" fill="${D}"/><path d="M102 128l46-24v30l-46 24z" fill="hsl(${h} 50% 32%)"/><circle cx="90" cy="102" r="4" fill="#fff" opacity=".5"/><circle cx="112" cy="108" r="4" fill="#fff" opacity=".5"/><circle cx="102" cy="94" r="4" fill="#fff" opacity=".5"/>`,
 cro:`<path d="M36 132C36 90 70 64 100 64s64 26 64 68c-18-10-26-26-64-26s-46 16-64 26z" fill="hsl(34 78% 58%)"/><path d="M70 82l10 28M100 70v34M130 82l-10 28" stroke="hsl(30 70% 38%)" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M44 122c18-8 30-20 56-20s38 12 56 20" stroke="#fff" stroke-opacity=".3" stroke-width="4" fill="none" stroke-linecap="round"/>`,
 sand:`<path d="M46 98a54 30 0 0 1 108 0z" fill="#e3b46a"/><rect x="40" y="98" width="120" height="9" rx="4" fill="#f2c94c"/><path d="M38 109q12 9 24 0t24 0 24 0 24 0 24 0v6H38z" fill="#5fc99a"/><rect x="42" y="117" width="116" height="10" rx="5" fill="#e0453a"/><rect x="46" y="127" width="108" height="22" rx="11" fill="#e3b46a"/>`};
 return `<svg viewBox="0 0 200 200" aria-hidden="true">${S[kind]}</svg>`}

async function upImg(file,max){const url=await new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(res,"image/jpeg",.8)};im.src=r.result};r.readAsDataURL(file)});
 const path=Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)+".jpg";
 const{error}=await sb.storage.from("menu-images").upload(path,url,{contentType:"image/jpeg",cacheControl:"31536000"});if(error)throw error;
 return sb.storage.from("menu-images").getPublicUrl(path).data.publicUrl}
function shrink(file,max,cb){toast("جاري رفع الصورة…");upImg(file,max).then(cb).catch(fail)}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const grad=h=>`linear-gradient(135deg,hsl(${h} 70% 32%),hsl(${h} 45% 14%))`;
const T=k=>(ST.ca||{})[k]||k;
const money=n=>ST.cur==="SYP"?Math.round(n).toLocaleString("en-US")+" ل.س":new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n);
const cur=()=>ST.cur==="SYP"?"ل.س":"$";
const nf=n=>Number(n).toLocaleString("en-US");

/* ---------- الحالة ---------- */
const app=document.getElementById("app");
let auth=false;
let tab="items",sheet=null,filt=0,tt;
function toast(msg,bad){const el=document.getElementById("toast");el.textContent=(bad?"⚠️ ":"✅ ")+msg;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2200)}
async function commit(msg){await saveST();if(msg)toast(msg)}

function applyBrand(){const r=document.documentElement.style,c=ST.color;
 if(c){const n=parseInt(c.slice(1),16),l=(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))/255;
  r.setProperty("--amber",c);r.setProperty("--ember","color-mix(in srgb,"+c+" 70%,#000)");r.setProperty("--on",l>.6?"#1a1209":"#fff")}
 else["--amber","--ember","--on"].forEach(k=>r.removeProperty(k));
 document.title=ST.name+" | لوحة التحكم"}

/* ---------- عرض ---------- */
const IC={
 items:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
 cafe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 3v2M12 3v2"/></svg>',
 security:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
 qr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h3M20 17v4"/></svg>'};

function render(){
 applyBrand();
 document.body.style.overflow=sheet?"hidden":"";
 if(!sb){app.innerHTML=`<div class="lg"><h1>الإعداد ناقص</h1><p>عبّي ملف config.js برابط ومفتاح Supabase ثم أعد النشر.</p></div>`;return}
 if(!auth){app.innerHTML=`<form class="lg" data-f="login"><h1>${esc(ST.name)}</h1><p>لوحة التحكم — أدخل كلمة المرور</p><input class="fi" name="pw" type="password" autocomplete="current-password" placeholder="كلمة المرور" aria-label="كلمة المرور" required autofocus><button class="btn">دخول</button><a class="ghost" href="menu.html">العودة للقائمة</a></form>`;return}
 const tabs=[["items","الأصناف"],["qr","رمز QR"],["security","الأمان"]];
 app.innerHTML=`<header class="top"><div class="in">${ST.logo?`<img class="logo" src="${esc(ST.logo)}" alt="">`:""}<div class="ttl"><b>${esc(ST.name)}</b><small>لوحة التحكم</small></div></div></header>
 <main class="pg">${tab==="items"?vItems():tab==="security"?vSecurity():vQR()}</main>
 <nav class="bt" aria-label="الأقسام"><div class="in">${tabs.map(([k,l])=>`<button data-a="tab" data-k="${k}" ${tab===k?'aria-current="page"':""}>${IC[k]}${l}</button>`).join("")}</div></nav>
 ${sheet?vItem():""}`;
 if(tab==="qr"&&!sheet)drawQR();
 if(sheet){const f=app.querySelector(".sh input[name=n]");if(f&&sheet.id==="new")f.focus()}}

function vItems(){
 const out=MENU.filter(d=>d.ok===false).length,ids=CATS.map((_,i)=>i).slice(1).filter(i=>!filt||i===filt);
 const groups=ids.map(i=>({i,l:MENU.filter(d=>d.c===i)})).filter(g=>g.l.length);
 return `
 <button class="btn" data-a="new">＋ إضافة صنف</button>
 <p class="sum">${nf(MENU.length)} صنف${out?` · ${nf(out)} نفد`:""} — استخدم القلم للتعديل، وسلة المهملات للحذف، والمفتاح لإيقاف الصنف عند نفاده.</p>
 <div class="chips"><button class="chip" aria-pressed="${!filt}" data-a="filt" data-i="0">الكل</button>${CATS.slice(1).map((c,i)=>`<button class="chip" aria-pressed="${filt===i+1}" data-a="filt" data-i="${i+1}">${esc(T(c))}</button>`).join("")}</div>
 ${groups.map(g=>`${filt?"":`<div class="gh">${esc(T(CATS[g.i]))}</div>`}<div class="rows" ${filt?'style="margin-top:12px"':""}>${g.l.map(row).join("")}</div>`).join("")||`<div class="empty">ما في أصناف هون بعد.<br>اضغط «إضافة صنف» لتبدأ.</div>`}`}

function row(d){const ok=d.ok!==false;
 return `<div class="rw ${ok?"":"off"}"><div class="rh"><div class="rn">${esc(d.n)}</div><div class="rp">${money(d.p)}</div></div>
 <div class="rr"><div class="rb"><span class="th" style="background:${grad(d.h||30)}"><span class="e">${art(d)}</span>${d.img?`<img src="${esc(d.img)}" alt="" onerror="this.remove()">`:""}</span></div>
 <button class="tg" role="switch" aria-checked="${ok}" aria-label="متوفر: ${esc(d.n)}" data-a="stock" data-id="${esc(d.id)}"><i class="sw"></i><span>${ok?"متوفر":"نفد"}</span></button>
 <button class="ib" data-a="edit" data-id="${esc(d.id)}" aria-label="تعديل: ${esc(d.n)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 7.5l3 3"/></svg></button>
 <button class="ib del" data-a="del" data-id="${esc(d.id)}" aria-label="حذف: ${esc(d.n)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button></div></div>`}

function vSecurity(){return `<form class="card" data-f="pass"><h2>تغيير كلمة المرور</h2>
 <label class="fl">كلمة المرور الحالية<input class="fi" name="old" type="password" autocomplete="current-password" required></label>
 <label class="fl">كلمة المرور الجديدة<input class="fi" name="n1" type="password" autocomplete="new-password" minlength="6" required></label>
 <label class="fl">أعد كتابة كلمة المرور الجديدة<input class="fi" name="n2" type="password" autocomplete="new-password" minlength="6" required></label>
 <p class="hint">6 أحرف على الأقل.</p><button class="btn">حفظ كلمة المرور</button></form>
 <button class="ghost" style="width:100%" data-a="out">تسجيل الخروج</button>`}
const sf=(l,k,v,x="")=>`<label class="fl">${l}<input class="fi" data-s="${k}" value="${esc(v)}" ${x}></label>`;

const pubUrl=()=>ST.url||new URL("menu.html",location.href).href;
function vQR(){return `<div class="card qr" id="qrp"><h2>${esc(ST.name)}</h2><div class="qb" id="qrb"></div><p class="hint">امسح الرمز لعرض القائمة</p></div>
 ${location.protocol==="file:"&&!ST.url?`<div class="warn"><span>القائمة مو منشورة على الإنترنت بعد، فالرمز الحالي ما رح يفتح عند الزبائن. الصق رابط القائمة بعد نشرها.</span></div>`:""}
 <div class="card"><label class="fl">رابط القائمة<input class="fi" type="url" dir="ltr" data-s="url" value="${esc(ST.url)}" placeholder="${esc(pubUrl())}"></label><p class="hint">اتركه فاضي إذا بدك الرابط الحالي للصفحة.</p>
 <div class="br"><button class="btn sm" style="flex:1" data-a="dl">تنزيل الصورة</button><button class="ghost" style="flex:1" data-a="pr">طباعة</button></div></div>`}
function drawQR(){const b=app.querySelector("#qrb");if(!b)return;b.innerHTML="";try{new QRCode(b,{text:pubUrl(),width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}catch(e){b.textContent="تعذّر إنشاء الرمز"}}

const EMO=["☕","🥛","🍵","🧊","🍋","🍓","🍨","🍫","🍪","🥐","🥪","🍽️"];
function vItem(){const nw=sheet.id==="new",d=nw?{n:"",d:"",p:"",c:filt||1,e:"🍽️",t:"",ok:true,img:""}:MENU.find(x=>x.id===sheet.id);
 return `<div class="mo" data-a="mc"><form class="sh" data-f="item" role="dialog" aria-modal="true" aria-label="${nw?"إضافة صنف":"تعديل الصنف"}">
 <div class="shh"><h2>${nw?"إضافة صنف":"تعديل الصنف"}</h2><button type="button" class="x" data-a="mc" aria-label="إغلاق">×</button></div>
 <label class="fl">اسم الصنف<input class="fi" name="n" value="${esc(d.n)}" required></label>
 <div class="g2"><label class="fl">السعر<span class="pr"><input class="fi" name="p" type="number" inputmode="decimal" step="any" min="0" value="${esc(d.p)}" required><span>${cur()}</span></span></label>
 <label class="fl">التصنيف<select class="fi" name="c">${CATS.map((c,i)=>i?`<option value="${i}" ${i===+d.c?"selected":""}>${esc(T(c))}</option>`:"").join("")}</select></label></div>
 <label class="fl">وصف قصير (اختياري)<textarea class="fi" name="d" rows="2">${esc(d.d)}</textarea></label>
 <div class="fl">شارة<div class="seg">${[["","بدون"],["الأكثر طلباً","الأكثر طلباً"],["جديد","جديد"]].map(([v,l])=>`<label><input type="radio" name="t" value="${v}" ${v===(d.t||"")?"checked":""}>${l}</label>`).join("")}</div></div>
 <div class="fl">صورة (اختياري)<div class="up"><span class="pv" id="pv">${d.img?`<img src="${esc(d.img)}" alt="">`:"📷"}</span><div class="bs"><label class="ghost">اختيار صورة<input type="file" accept="image/*" data-up="img"></label><button type="button" class="ghost dg" data-a="rmimg" ${d.img?"":"hidden"}>حذف</button></div><input type="hidden" name="img" value="${esc(d.img||"")}"></div></div>
 <label class="cb"><input type="checkbox" name="ok" ${d.ok!==false?"checked":""}> متوفر الآن</label>
 <div class="br"><button type="button" class="ghost" style="flex:1" data-a="mc">إلغاء</button><button class="btn" style="flex:2">حفظ</button></div>
 ${nw?"":`<button type="button" class="link" data-a="del" data-id="${esc(d.id)}">حذف الصنف</button>`}</form></div>`}

/* ---------- أحداث ---------- */
app.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
 if(a==="mc"&&b.classList.contains("mo")&&e.target!==b)return;
 switch(a){
  case"out":await sb.auth.signOut();auth=false;MENU=[];break;
  case"tab":tab=b.dataset.k;sheet=null;scrollTo(0,0);break;
  case"filt":filt=+b.dataset.i;break;
  case"new":sheet={type:"item",id:"new"};break;
  case"edit":sheet={type:"item",id};break;
  case"mc":sheet=null;break;
  case"stock":{const d=MENU.find(x=>x.id===id),nv=d.ok===false;const{error}=await sb.from("menu_items").update({ok:nv}).eq("id",id);if(error){fail(error);return}d.ok=nv;toast(nv?"صار «"+d.n+"» متوفر":"تم إيقاف «"+d.n+"»");break}
  case"del":{const d=MENU.find(x=>x.id===id);if(!confirm("حذف «"+d.n+"» نهائياً؟"))return;const{error}=await sb.from("menu_items").delete().eq("id",id);if(error){fail(error);return}MENU=MENU.filter(x=>x.id!==id);sheet=null;toast("تم الحذف");break}
  case"color":ST.color=b.dataset.v;commit("تم الحفظ");break;
  case"rmlogo":ST.logo="";commit("تم حذف الشعار");break;
  case"rmimg":{const f=b.closest("form");f.elements.img.value="";f.querySelector("#pv").textContent="📷";b.hidden=true;return}
  case"dl":{const c=app.querySelector("#qrb canvas");if(c){const l=document.createElement("a");l.download="menu-qr.png";l.href=c.toDataURL();l.click()}return}
  case"pr":print();return;
  default:return}
 render()});

app.addEventListener("submit",async e=>{e.preventDefault();const f=e.target,k=f.dataset.f,v=Object.fromEntries(new FormData(f));
 if(k==="login"){const{error}=await sb.auth.signInWithPassword({email:CFG.ADMIN_EMAIL,password:v.pw});if(error){toast("بيانات الدخول غير صحيحة",1);f.elements.pw.value="";return}auth=true;if(!await pull())return}
 else if(k==="item"){const r={n:v.n.trim(),d:(v.d||"").trim(),p:Math.max(0,+v.p||0),c:+v.c,t:v.t||"",ok:!!v.ok,img:v.img||""};
  r.t=r.t||null;let q;
  if(sheet.id==="new")q=sb.from("menu_items").insert({id:"x"+Date.now().toString(36),h:20+Math.floor(Math.random()*25),e:"🍽️",sort:Math.max(0,...MENU.map(x=>x.sort||0))+1,...r});else q=sb.from("menu_items").update(r).eq("id",sheet.id);
  const{error}=await q;if(error){fail(error);return}await pull();
  filt=filt&&filt!==r.c?0:filt;sheet=null;toast("تم الحفظ")}
 else if(k==="pass"){const{data:{user}}=await sb.auth.getUser();
  const chk=await sb.auth.signInWithPassword({email:user.email,password:v.old});if(chk.error){toast("كلمة المرور الحالية غير صحيحة",1);return}
  if(v.n1.length<6){toast("كلمة المرور لازم تكون 6 أحرف على الأقل",1);return}
  if(v.n1!==v.n2){toast("كلمتا المرور مو متطابقتين",1);return}
  const up=await sb.auth.updateUser({password:v.n1});if(up.error){fail(up.error);return}toast("تم تغيير كلمة المرور");f.reset();return}
 render()});

app.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.up&&t.files[0]){const n=t.dataset.up;shrink(t.files[0],n==="logo"?256:700,u=>{
   if(n==="logo"){ST.logo=u;commit("تم حفظ الشعار");render()}
   else{const f=t.closest("form");f.elements.img.value=u;f.querySelector("#pv").innerHTML=`<img src="${u}" alt="">`;f.querySelector("[data-a=rmimg]").hidden=false}});return}
 const k=t.dataset.s;if(!k)return;let v=t.value.trim();
 if(k==="name"&&!v){t.value=ST[k];toast("هذا الحقل مطلوب",1);return}
 ST[k]=v;commit("تم الحفظ");applyBrand();
 if(k==="cur"||k==="color")render()});
app.addEventListener("input",e=>{const t=e.target;if(t.dataset.s==="color"){ST.color=t.value;applyBrand()}});
addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet){sheet=null;render()}});
if(sb)sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"&&auth){auth=false;render()}});
(async()=>{if(sb){const{data}=await sb.auth.getSession();auth=!!data.session;if(auth&&!await pull())auth=false}render()})();
</script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))</script>
</body>
</html>
