:root[data-theme=light]{color-scheme:light;--ink:#faf5ee;--surface:#fffdf9;--raised:#f1e8dc;--line:#e2d5c4;--bone:#231a13;--muted:#6f6254;--amber:#c05610;--ember:#e07a33}
:root{color-scheme:dark;--ink:#15110e;--surface:#1e1814;--raised:#2a221c;--line:#3a2f26;--bone:#f4ebdf;--muted:#a99b8a;--amber:#f0a04b;--ember:#c8631f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:transparent;color:var(--bone);font:400 16px/1.5 IBM Plex Sans Arabic,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:60}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:relative;overflow:hidden;border-bottom:1px solid var(--line);padding:72px 0 52px}
header::after{content:"";position:absolute;right:-140px;top:-160px;width:440px;height:440px;border-radius:50%;background:var(--ember);opacity:.3;filter:blur(110px);pointer-events:none}
.kicker{color:var(--muted);font-size:14px;margin:0}
h1{font:600 clamp(48px,9vw,88px)/1.02 IBM Plex Sans Arabic,system-ui,sans-serif;margin:18px 0 0;letter-spacing:-.02em}
.tag{color:var(--muted);font-size:18px;max-width:34em;margin:18px 0 0}
.tools{display:flex;gap:14px;flex-wrap:wrap;margin-top:36px;position:relative;z-index:1}
.search{flex:1 1 320px;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:14px 20px;color:var(--bone);font:inherit;transition:.2s}
.search:focus{border-color:var(--amber);background:var(--raised);outline:0}
.live{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:12px 20px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:#34d399;animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}100%{box-shadow:0 0 0 10px rgba(52,211,153,0)}}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--ink) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:12px;padding-bottom:12px;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:9px 20px;border-radius:99px;color:var(--muted);font-size:14px;font-weight:500;transition:.3s}
.tab:hover{background:var(--raised);color:var(--bone)}
.tab[aria-pressed=true]{background:var(--amber);color:var(--on,var(--ink));box-shadow:0 0 0 1px color-mix(in srgb,var(--amber) 35%,transparent),0 14px 40px -14px color-mix(in srgb,var(--ember) 60%,transparent)}
.grid{display:grid;gap:24px;grid-template-columns:1fr;padding:40px 0}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;transition:.3s}
.card:hover{transform:scale(1.02);border-color:color-mix(in srgb,var(--amber) 50%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--amber) 35%,transparent),0 18px 50px -18px color-mix(in srgb,var(--ember) 45%,transparent)}
.pic{position:relative;aspect-ratio:4/3;display:grid;place-items:center;font-size:76px;overflow:hidden}
.pic span.e{transition:transform .6s}
.card:hover .pic span.e{transform:scale(1.15) rotate(-4deg)}
.pic img,.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s}
.card:hover .pic img{transform:scale(1.1)}
.th{position:relative;overflow:hidden}
.card{position:relative}
.sold{position:absolute;inset:0;z-index:3;display:grid;place-items:center;border-radius:inherit;background:color-mix(in srgb,var(--ink) 28%,transparent);-webkit-backdrop-filter:blur(3.5px) saturate(.85);backdrop-filter:blur(3.5px) saturate(.85);cursor:not-allowed}
.soldt{position:absolute;inset:0;z-index:4;display:grid;place-items:center;text-align:center;padding:8px;font-size:clamp(15px,4.4vw,22px);font-weight:500;line-height:1.35;color:#ffffffe6;letter-spacing:.02em;text-shadow:0 2px 18px #000a;pointer-events:none}

.card:has(.sold):hover{transform:none;box-shadow:none}
.badge{position:absolute;inset-inline-start:12px;top:12px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;background:var(--bone);color:var(--ink)}
.b-best{background:var(--amber)}.b-spicy{background:#ef4444;color:#fff}.b-veg{background:#34d399}
.body{display:flex;flex-direction:column;flex:1;padding:20px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h3{font:600 20px/1.25 IBM Plex Sans Arabic,system-ui,sans-serif;margin:0}
.price{color:var(--amber);font-weight:600}

.rd:hover{background:var(--raised)}.rd.p{background:var(--amber);color:var(--on,var(--ink))}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:80px 0}
.bar{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:14px;background:var(--amber);color:var(--on,var(--ink));font-weight:600;padding:12px 24px 12px 14px;border-radius:99px;box-shadow:0 0 0 1px color-mix(in srgb,var(--amber) 35%,transparent),0 18px 50px -10px color-mix(in srgb,var(--ember) 60%,transparent);transition:transform .2s;white-space:nowrap}
.bar:hover{transform:translateX(-50%) scale(1.05)}
.cnt{display:grid;place-items:center;min-width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--amber);font-size:14px;animation:pop .3s}

.ov{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.dr{position:fixed;top:0;inset-inline-end:0;bottom:0;width:min(440px,100%);z-index:71;background:var(--surface);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;animation:in .35s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px)}
@keyframes in{from{transform:translateX(calc(100% * var(--d,1)))}}
.dh{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--line)}
.dh h2{font:600 26px IBM Plex Sans Arabic,system-ui,sans-serif;margin:0}
.x{width:40px;height:40px;border-radius:50%;font-size:22px}.x:hover{background:var(--raised)}
.lines{flex:1;overflow-y:auto;list-style:none;margin:0;padding:0 20px}
.lines li{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.th{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:30px}
.lines .n{flex:1;font-weight:500;line-height:1.25}.lines .n small{display:block;color:var(--amber);margin-top:4px;font-size:14px}
.ft{padding:20px calc(20px + env(safe-area-inset-bottom,0px)) 20px 20px;border-top:1px solid var(--line);font-size:14px}
.ft div{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:8px}
.ft .t{color:var(--bone);font-size:18px;font-weight:600;padding-top:8px}
.go{width:100%;margin-top:14px;background:var(--amber);color:var(--on,var(--ink));font-weight:600;padding:14px;border-radius:99px}
.msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:32px;color:var(--muted)}
.msg h2{font:600 24px IBM Plex Sans Arabic,system-ui,sans-serif;color:var(--bone);margin:0}
.sk{background:linear-gradient(100deg,var(--raised) 30%,var(--line) 50%,var(--raised) 70%)!important;background-size:200% 100%!important;animation:sh 1.3s infinite linear}
.sk .e{opacity:0}
@keyframes sh{to{background-position:-200% 0}}
.skl{height:16px;border-radius:8px;background:var(--raised);animation:pu 1.3s infinite}
@keyframes pu{50%{opacity:.5}}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-top:32px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:14px;color:var(--muted);transition:.3s}
.chip:hover{border-color:var(--muted);color:var(--bone)}
.chip[aria-pressed=true]{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber)}
.count{margin-inline-start:auto;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);opacity:0;z-index:80;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--surface) 95%,transparent);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);border-radius:99px;padding:12px 20px;font-size:14px;font-weight:500;box-shadow:0 0 0 1px color-mix(in srgb,var(--amber) 20%,transparent),0 18px 50px -18px color-mix(in srgb,var(--ember) 50%,transparent);backdrop-filter:blur(8px);transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px)}
.toast.show{transform:translate(-50%,0);opacity:1}
[dir=rtl]{--d:-1}
[dir=rtl] body,[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] button,[dir=rtl] input{font-family:IBM Plex Sans Arabic,system-ui,sans-serif}
#bg{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
.ctl{position:absolute;top:20px;inset-inline-end:20px;z-index:2;display:flex;gap:8px}
.ib{height:40px;min-width:40px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--bone);font-size:14px;font-weight:600;transition:.2s}
.ib:hover{border-color:var(--amber);transform:scale(1.05)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.ah{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}

.dg{color:#ef4444}
.rows{display:flex;flex-direction:column;gap:10px;margin:16px 0}

.sw{width:46px;height:26px;border-radius:99px;background:var(--raised);border:1px solid var(--line);position:relative;flex:none}

.pn{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.fi{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:11px 14px;color:var(--bone);font:inherit;width:100%}.fi:focus{border-color:var(--amber);outline:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ck{display:flex;gap:8px;align-items:center}.br{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.mo{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.md{width:min(480px,100%);max-height:92vh;overflow-y:auto;margin:0}
.lg{width:min(360px,calc(100% - 32px));margin:18vh auto 0;display:flex;flex-direction:column;gap:12px;text-align:center}.lg h2{font:600 30px IBM Plex Sans Arabic,system-ui,sans-serif;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column}.stats b{font:600 20px IBM Plex Sans Arabic,system-ui,sans-serif;color:var(--amber)}.stats span{font-size:13px;color:var(--muted)}
.ir{display:flex;gap:12px;align-items:center}.pv{width:64px;height:64px;border-radius:14px;background:var(--raised);overflow:hidden;flex:none}.pv img{width:100%;height:100%;object-fit:cover}.ic{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.sc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sc button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.qb{background:#fff;padding:14px;border-radius:18px;display:inline-block}.mt{color:var(--muted);text-align:center;padding:40px 0;margin:0}

/* ===== ترويسة: الاسم بالمنتصف + البحث ===== */
header#hero{padding:44px 0 20px;text-align:center}
header#hero .wrap{text-align:center}
header#hero h1{font-size:clamp(44px,15vw,120px);margin:0 0 20px;line-height:1.4;text-align:center;text-wrap:balance}
header#hero .tools{margin:0 auto;max-width:560px;justify-content:center}
/* ===== شاشة افتتاحية (أنيميشن Cinder & Salt) ===== */
.card.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(28px)}}
body:not(.ready) .rv{opacity:0}
.ready .rv{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--r)*60ms)}
#intro{position:fixed;inset:0;z-index:200;cursor:pointer}
body:not(.ready) header,body:not(.ready) nav,body:not(.ready) main{visibility:hidden}
.ready nav,.ready main{animation:fi .5s backwards}
@keyframes fi{from{opacity:0}}
#intro .mark{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 20px;text-align:center;transition:opacity .5s,transform .9s,filter .6s}
#intro.out .mark{opacity:0;transform:scale(1.12);filter:blur(8px)}
#intro .glow{position:absolute;left:50%;top:50%;width:520px;height:520px;max-width:90vw;transform:translate(-50%,-50%);border-radius:50%;background:var(--ember);opacity:.28;filter:blur(110px);animation:gl 2.4s ease-out both}
@keyframes gl{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}}
#intro .nm{position:relative;font:400 clamp(44px,13vw,120px)/1.35 "Pacifico","Aref Ruqaa","IBM Plex Sans Arabic",serif;letter-spacing:0;display:flex;flex-wrap:wrap;justify-content:center;color:var(--bone)}
#intro .nm span{display:inline-block;animation:lt .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--k)*55ms + .2s)}
@keyframes lt{from{opacity:0;transform:translateY(40px) rotate(4deg);filter:blur(12px)}}
#intro .ln{position:relative;height:2px;width:min(220px,50vw);background:linear-gradient(90deg,transparent,var(--amber),transparent);animation:lw .9s .9s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes lw{from{transform:scaleX(0);opacity:0}}
#intro p{position:relative;margin:0;color:var(--muted);font-size:15px;animation:fd .8s 1.3s backwards}
@keyframes fd{from{opacity:0;transform:translateY(10px)}}
/* ===== خلفيات أشفّ ===== */
.card{background:color-mix(in srgb,var(--bone) 5%,transparent);border-color:color-mix(in srgb,var(--bone) 14%,transparent);-webkit-backdrop-filter:none;backdrop-filter:none}
.search{background:color-mix(in srgb,var(--bone) 6%,transparent);border-color:color-mix(in srgb,var(--bone) 16%,transparent);-webkit-backdrop-filter:none;backdrop-filter:none}
.search:focus{background:color-mix(in srgb,var(--bone) 10%,transparent)}

const T=k=>(ST.ca||{})[k]||k,dn=d=>d.n,dd=d=>d.d||"";

function visible(){const q=query.trim().toLowerCase();
  const any=diet.veg||diet.spicy; // both chips on = dishes matching either
  return MENU.filter(d=>(!any||(diet.veg&&d.t==="Vegetarian")||(diet.spicy&&d.t==="Spicy"))&&(cat===0||d.c===cat)&&(!q||(d.n+" "+d.d).toLowerCase().includes(q)));}
function renderTabs(){
  document.getElementById("tabs").innerHTML=CATS.map((c,i)=>`<button class="tab" aria-pressed="${i===cat}" data-cat="${i}">${T(c)}</button>`).join("");}
function renderGrid(){
  if(loading){document.getElementById("grid").innerHTML=Array.from({length:6},()=>'<article class="card"><div class="pic sk"></div><div class="body"><div class="skl" style="width:60%;height:22px"></div><div class="skl" style="width:100%;margin-top:12px"></div><div class="skl" style="width:80%;margin-top:8px"></div></div></article>').join("");return;}
  const list=visible();renderChips(list.length);const en=enter;enter=false;
  document.getElementById("grid").innerHTML=list.length?list.map((d,i)=>{
    const q=cart[d.id]||0;
    return `<article class="card${en?" rise":""}" style="--i:${i}"><div class="pic sk" style="background:${grad(d.h)}"><span class="e" aria-hidden="true">${art(d)}</span>${photo(d.id,600,esc(d.n))}${d.t&&d.ok!==false?`<span class="badge ${bcls(d.t)}">${T(d.t)}</span>`:""}${d.ok===false?`<span class="soldt">غير متوفر حالياً</span>`:""}</div>
    <div class="body"><div class="row"><h3>${esc(dn(d))}</h3><span class="price">${money(d.p)}</span></div><p class="desc">${esc(dd(d))}</p>
    </div>${d.ok===false?`<div class="sold" role="status" aria-label="غير متوفر حالياً"></div>`:""}</article>`}).join("")

const lines=()=>MENU.filter(d=>cart[d.id]).map(d=>({d,q:cart[d.id]}));
function renderBar(){
  const L=lines(),n=L.reduce((s,l)=>s+l.q,0),t=L.reduce((s,l)=>s+l.q*l.d.p,0);

  const el=document.getElementById("drawer");

  try{localStorage.setItem("cs-lang",lang);localStorage.setItem("cs-theme",theme);}catch(e){}

let tt;
function toast(msg,bad){const el=document.getElementById("toast");el.textContent=(bad?"⚠️ ":"✅ ")+msg;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2200);}

function applyBrand(){const r=document.documentElement.style,c=ST.color;

document.addEventListener("click",e=>{
  const t=e.target.closest("button,.ov");if(!t)return;
  if(t.dataset.cat!==undefined){cat=+t.dataset.cat;renderTabs();renderGrid();}
  else if(t.id==="langBtn"){lang=lang==="en"?"ar":"en";applyUI();}
  else if(t.id==="themeBtn"){theme=theme==="dark"?"light":"dark";applyUI();}
  else if(t.dataset.diet){diet[t.dataset.diet]=!diet[t.dataset.diet];renderGrid();}
  else if(t.dataset.add){cart[t.dataset.add]=(cart[t.dataset.add]||0)+1;all();toast(AD(t.dataset.add));}
  else if(t.dataset.rm){if((cart[t.dataset.rm]||0)<=1)delete cart[t.dataset.rm];else cart[t.dataset.rm]--;all();}
  else if(t.id==="openCart"){open=true;all();}
  else if(t.id==="close"||t.id==="ov"||t.id==="back")closeDrawer();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&open)closeDrawer();});

applyUI();startSync();

  R.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.5:2));
  const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,100);cam.position.z=10;
  const pos=new Float32Array(N*3),sd=new Float32Array(N),sp=new Float32Array(N);
  for(let i=0;i<N;i++){pos.set([(Math.random()-.5)*26,(Math.random()-.5)*14,Math.random()*10-6],i*3);sd[i]=Math.random();sp[i]=.25+Math.random()*.5;}
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));g.setAttribute("aSeed",new THREE.BufferAttribute(sd,1));g.setAttribute("aSpeed",new THREE.BufferAttribute(sp,1));
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
    uniforms:{uTime:{value:0},uPx:{value:R.getPixelRatio()},uOpacity:{value:1},uGather:{value:1},uA:{value:new THREE.Vector3()},uB:{value:new THREE.Vector3()}},
    vertexShader:`attribute float aSeed;attribute float aSpeed;uniform float uTime;uniform float uPx;uniform float uGather;varying float vAlpha;varying float vMix;
    void main(){vec3 p=position;p.y=mod(position.y+uTime*aSpeed+7.0,14.0)-7.0;p.x+=sin(uTime*.35+aSeed*6.2831)*.5;p.z+=cos(uTime*.28+aSeed*6.2831)*.3;
    float t=(p.y+7.0)/14.0;float tw=.55+.45*sin(uTime*2.5+aSeed*40.0);
    vec3 o=vec3(sin(aSeed*91.3),cos(aSeed*57.1),sin(aSeed*33.7))*(.35+1.4*fract(aSeed*17.0));
    float a=uTime*(.5+aSeed*1.2);o.xz=mat2(cos(a),-sin(a),sin(a),cos(a))*o.xz;
    p=mix(p,o,uGather);
    vec4 mv=modelViewMatrix*vec4(p,1.0);gl_Position=projectionMatrix*mv;gl_PointSize=(4.0+aSeed*9.0)*uPx*(10.0/-mv.z)*(1.0-.4*uGather);
    float al=smoothstep(0.0,.1,t)*(1.0-smoothstep(.55,1.0,t))*tw;vAlpha=mix(al,tw,uGather)*(1.0-.35*uGather);vMix=aSeed;}`,
    fragmentShader:`uniform vec3 uA;uniform vec3 uB;uniform float uOpacity;varying float vAlpha;varying float vMix;
    void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,.0,d);gl_FragColor=vec4(mix(uA,uB,vMix),a*a*vAlpha*uOpacity);}`});
  const pts=new THREE.Points(g,m);scene.add(pts);
  let mx=0,my=0,time=reduce?5:0,last=performance.now(),spreadAt=0;
  window.emberOpen=()=>{spreadAt=performance.now()||1;};
  if(window.emberOpened)window.emberOpen();
  if(reduce)m.uniforms.uGather.value=0;
  const draw=()=>R.render(scene,cam);
  const theme=()=>{const l=document.documentElement.dataset.theme==="light";
    m.uniforms.uA.value.set(...(l?[.75,.34,.06]:[.94,.63,.29]));m.uniforms.uB.value.set(...(l?[.88,.48,.2]:[.78,.39,.12]));
    m.uniforms.uOpacity.value=l?.5:.95;m.blending=l?THREE.NormalBlending:THREE.AdditiveBlending;m.needsUpdate=true;if(reduce)draw();};
  const size=()=>{R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();if(reduce)draw();};
  const frame=now=>{time+=Math.min((now-last)/1000,.05);last=now;m.uniforms.uTime.value=time;
    if(spreadAt){const k=Math.min((now-spreadAt)/1900,1),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;m.uniforms.uGather.value=1-e;}
    pts.rotation.y+=(mx*.18-pts.rotation.y)*.04;pts.rotation.x+=(my*.1-pts.rotation.x)*.04;pts.position.y=scrollY*.004;draw();};
  const start=()=>{last=performance.now();R.setAnimationLoop(frame);};
  new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  theme();size();addEventListener("resize",size);
  if(!reduce){addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;},{passive:true});
    document.addEventListener("visibilitychange",()=>document.hidden?R.setAnimationLoop(null):start());start();}
}
// الجمر خلفية تجميلية: ما نحمّلها إلا بعد ما تظهر القائمة، وما نحمّلها على النت البطيء أو توفير البيانات
function loadEmbers(){const c=navigator.connection||{};
  if(c.saveData||/^(slow-2g|2g|3g)$/.test(c.effectiveType||""))return;
  const s=document.createElement("script");s.src="/vendor/three.min.js";s.onload=initEmbers;document.head.appendChild(s)}
addEventListener("load",()=>setTimeout(loadEmbers,3000));
// The menu is static, so this short delay stands in for a real fetch and shows the skeleton state

// شاشة افتتاحية: الاسم يطلع حرف حرف، الجمر يتجمّع ثم ينتشر، والقائمة تطلع من تحت لفوق
const REDUCE=matchMedia("(prefers-reduced-motion: reduce)").matches;
function reveal(){loading=false;enter=true;renderGrid();}
function intro(){
  const el=document.getElementById("intro");
  const ready=()=>{document.body.classList.add("ready");};
  setTimeout(()=>{if(!document.body.classList.contains("ready")){ready();if(loading)reveal();}},9000);
  if(REDUCE){el.remove();ready();setTimeout(reveal,250);return;}
  const nm=ST.name||"";
  document.getElementById("inm").innerHTML=/[\u0600-\u06FF]/.test(nm)?`<span style="--k:0">${esc(nm)}</span>`:[...nm].map((c,i)=>`<span style="--k:${i}">${c===" "?"&nbsp;":esc(c)}</span>`).join("");
  document.getElementById("inm").style.direction=/[\u0600-\u06FF]/.test(nm)?"rtl":"ltr";
  document.getElementById("isub").textContent=ST.kicker||"";
  document.body.style.overflow="hidden";
  // نجهّز القائمة ونفك ضغط الصور وقت الافتتاحية، حتى ما يصير تقطيع لما تنفتح
  setTimeout(()=>{reveal();document.querySelectorAll(".card img").forEach(im=>{im.decode&&im.decode().catch(()=>{})});},350);
  let done=false;
  const openIt=()=>{if(done)return;done=true;
    const wait=window.emberOpen?1500:500;
    window.emberOpened=true;if(window.emberOpen)window.emberOpen();el.classList.add("out");
    setTimeout(()=>{el.remove();document.body.style.overflow="";},1100);
    setTimeout(ready,wait);};
  el.addEventListener("click",openIt);setTimeout(openIt,2700);
}
// ننتظر الخطوط (بحد أقصى 1.5 ثانية) حتى ما يظهر الاسم بخط مؤقت ثم يتبدل
Promise.race([Promise.all([document.fonts.load('400 1em Pacifico'),document.fonts.load('600 1em "IBM Plex Sans Arabic"')]),new Promise(r=>setTimeout(r,1500))]).catch(()=>{}).then(intro);
